name: Deploy on Push

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-conoha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Inject GA4 tag
        env:
          GA4_ID: ${{ secrets.GA4_ID }}
        run: |
          if [ -n "$GA4_ID" ]; then python3 scripts/inject_ga.py "$GA4_ID"; fi

      - name: Deploy to ConoHa WING via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /public_html/stock-overflow24.com/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            *.md
            build.py
            scripts/**
            requirements.txt
            data/**
            redirect-manabiya/**

      - name: Redirect manabiya -> apex (旧サブドメインを本店へ301転送)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./redirect-manabiya/
          server-dir: /public_html/manabiya.stock-overflow24.com/
